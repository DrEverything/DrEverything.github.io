<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#7c35d6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <script>
      window.__initialPath = window.location.pathname;
      try {
        if (localStorage.getItem("theme") === "light") {
          document.documentElement.classList.remove("dark");
        } else {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}

      // Hide the body until SvelteKit hydrates to prevent FOUC and landing page flashes on subroutes
      document.documentElement.classList.add("loading-app");
    </script>

    <style>
      html.dark {
        background-color: #141316;
        background-color: oklch(0.141 0.005 285.823);
        color: #fdfcfd;
        color: oklch(0.985 0 0);
      }
      html:not(.dark) {
        background-color: #f8f8f9;
        background-color: oklch(0.98 0.002 286);
        color: #141316;
        color: oklch(0.141 0.005 285.823);
      }
      body {
        background-color: inherit;
        color: inherit;
      }
      html.loading-app body {
        opacity: 0 !important;
        transition: none !important;
      }
    </style>
    <noscript>
      <style>
        html.loading-app body {
          opacity: 1 !important;
        }
      </style>
    </noscript>

    %sveltekit.head%
  </head>

  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
